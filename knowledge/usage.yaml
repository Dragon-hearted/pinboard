# systems/pinboard/knowledge/usage.yaml
# Canonical usage source for the ReadmeEngine (spec Appendix A).
# Authored by recon-pinboard from deep source inventory + RUN & VERIFY pass.

features:
  - name: "Pinterest pin import"
    description: "Press `p` to paste a public pinterest.com/pin/… or pin.it/… URL; the highest-resolution image (og:image → twitter:image → largest <img>) is downloaded (10 MB cap) and stored as a reference. No login or API key."
  - name: "Local & clipboard reference add"
    description: "Press `a` to add image references by path. Supports multi-path paste, drag-and-drop, and Ctrl/Cmd+V clipboard-image paste."
  - name: "ImageEngine generation"
    description: "Press `g` to generate from the current prompt + tagged-INPUT refs. Posts to ImageEngine `POST /api/generate`; auto-spawns the engine subprocess if it isn't already listening on :3002."
  - name: "PromptWriter per-model templating"
    description: "Before sending, the draft is massaged per selected model — NanoBanana models get a trailing 'No text in image.' and every prompt is truncated to the model's character cap (default 8192) on a word boundary."
  - name: "Claude Code vision prompt drafting"
    description: "Type intent in the Intent box and press `w` to draft a complete prompt from intent + reference images. Shells out to the local `claude` CLI (no paid API); cascades to the Anthropic SDK only if PINBOARD_ALLOW_API=1, then to a deterministic template."
  - name: "Reference intent toggle"
    description: "Press `t` to flip the highlighted ref between IN (sent to the image model as a reference) and DRAFT (seen only by vision when drafting the prompt, never sent to the model)."
  - name: "Promote generation to gallery"
    description: "Press `u` to promote the latest generation into the gallery as a new reference, enabling iterate-on-output loops."
  - name: "Aspect-ratio picker"
    description: "Press `r` to choose from 15 ratios (Auto, 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9, 1:4, 4:1, 1:8, 8:1)."
  - name: "Model picker"
    description: "Press `m` to pick the image model. Only models registered in PromptWriter AND served by ImageEngine's WisGate union are listed (NanoBanana Pro/Flash/Flash 2.5)."
  - name: "Reload tools / key rotation"
    description: "Press capital `R` after rotating WISDOM_GATE_KEY in .env: restarts the ImageEngine subprocess, re-reads .env files, and invalidates the Claude vision probe cache. See knowledge/key-rotation.md."
  - name: "In-terminal image preview"
    description: "Gallery and Preview panes render thumbnails inline via the terminal image protocol; Tab cycles gallery → prompt → preview; in Preview, j/k step generations and End jumps to newest."
  - name: "SQLite board storage"
    description: "WAL-enabled SQLite at pinboard.db with two tables: references/images (source='upload' | 'pinterest') and generations. Gallery removal (`d`, `x`/`X`) is a soft-delete — files under uploads/ are preserved on disk."
  - name: "Live budget readout"
    description: "Polls ImageEngine `GET /api/budget` every 10s and after each generation; budget + engine up/down status shown in the status bar."
  - name: "CI smoke test"
    description: "`pinboard --smoke` renders one frame to stderr and exits 0 ('ok'), so the TUI can be booted headlessly in CI without a TTY."

prerequisites:
  - "Bun v1.0+ — curl -fsSL https://bun.sh/install | bash"
  - "ImageEngine sibling service (systems/image-engine) running on :3002 — Pinboard auto-spawns it, or start manually: cd systems/image-engine && bun run src/index.ts"
  - "PromptWriter sibling (systems/prompt-writer) — provides the per-model prompt guides and registry; resolved via relative path at runtime"
  - "claude CLI (optional) — enables `w`/`v` vision drafting with no paid API; auto-detected on PATH or in ~/.claude/local, Homebrew, /usr/local/bin"
  - "An interactive terminal (both stdin and stdout must be a TTY) — the TUI refuses to launch when piped; use --smoke for headless checks"

configVars:
  - name: "IMAGE_ENGINE_URL"
    required: false
    description: "Base URL of the ImageEngine service. Default http://localhost:3002."
  - name: "WISDOM_GATE_KEY"
    required: true
    description: "WisGate provider key consumed downstream by ImageEngine for generation. Pinboard never calls WisGate directly; the engine re-reads it from .env on every call."
  - name: "PINBOARD_ALLOW_API"
    required: false
    description: "Set to 1 to opt into the paid Anthropic SDK vision fallback when the local claude CLI chain fails. Default off."
  - name: "ANTHROPIC_API_KEY"
    required: false
    description: "Anthropic key used only by the opt-in SDK vision fallback (PINBOARD_ALLOW_API=1). Billed against your account."
  - name: "CLAUDE_BIN"
    required: false
    description: "Override path to the claude CLI binary used for vision drafting. Defaults to `claude` on PATH with known-location fallbacks."
  - name: "PINBOARD_SMOKE_TIMEOUT_MS"
    required: false
    description: "Override the --smoke render timeout in milliseconds (default 150). The --smoke-timeout-ms flag takes precedence."

install:
  - "cd systems/pinboard"
  - "bun install"

usageSteps:
  - title: "Install dependencies"
    command: "cd systems/pinboard && bun install"
    expected: "Checks ~157 packages and exits 0 (verified: 'Done! Checked 157 packages')."
  - title: "Show help and flags"
    command: "bun run bin/pinboard --help"
    expected: "Prints usage, the five flags (--help, --version, --smoke, --smoke-timeout-ms, --no-color), examples, and exits 0. (verified)"
  - title: "Print version"
    command: "bun run bin/pinboard --version"
    expected: "Prints 'pinboard 0.2.0' and exits 0. (verified)"
  - title: "Headless smoke test (CI)"
    command: "bun run bin/pinboard --smoke"
    expected: "Renders one frame to stderr, prints 'ok' to stdout, exits 0. (verified)"
  - title: "Launch the interactive TUI"
    command: "just start    # or: bun run bin/pinboard"
    expected: "interactive TUI — launch manually. Opens the Ink reference board (Gallery · Preview · Prompt panes). Refuses to start without a TTY (exit 2)."
  - title: "Import a Pinterest reference"
    command: "Press 'p' in the TUI, paste a pinterest.com/pin/… or pin.it/… URL"
    expected: "interactive TUI — launch manually. Downloads the pin image into uploads/ and inserts a reference row (source='pinterest')."
  - title: "Add a local image reference"
    command: "Press 'a' in the TUI, paste one or more file paths (or Ctrl/Cmd+V a clipboard image)"
    expected: "interactive TUI — launch manually. Stores each image as a reference (source='upload')."
  - title: "Draft a prompt from intent + references"
    command: "Type intent in the Intent box, press 'w'"
    expected: "interactive TUI — launch manually. Requires the claude CLI (or PINBOARD_ALLOW_API=1 + ANTHROPIC_API_KEY) — falls back to a deterministic template when vision is unavailable. Fills the prompt textarea."
  - title: "Pick a model and aspect ratio"
    command: "Press 'm' (model), then 'r' (aspect ratio)"
    expected: "interactive TUI — launch manually. Model list limited to NanoBanana Pro/Flash/Flash 2.5; 15 aspect-ratio options."
  - title: "Generate an image"
    command: "Press 'g'"
    expected: "interactive TUI — requires WISDOM_GATE_KEY + ImageEngine on :3002 — not executed in recon. Applies the PromptWriter template, POSTs /api/generate, renders the result in the Preview pane, refreshes budget."
  - title: "Rotate keys / reload tools"
    command: "Edit systems/image-engine/.env (WISDOM_GATE_KEY=…), then press capital 'R'"
    expected: "interactive TUI — launch manually. Restarts the ImageEngine subprocess, re-reads .env, invalidates the vision probe cache; status bar flashes the updated keys."

commandsReference:
  - command: "bun run bin/pinboard --help"
    description: "Show help and all flags, then exit."
  - command: "bun run bin/pinboard --version"
    description: "Print version (pinboard 0.2.0) and exit."
  - command: "bun run bin/pinboard --smoke"
    description: "Render one frame and exit 0 — headless CI smoke test (TTY not required)."
  - command: "bun run bin/pinboard --smoke-timeout-ms <n>"
    description: "Override the smoke-test render timeout (default 150ms; integer only)."
  - command: "bun run bin/pinboard --no-color"
    description: "Disable ANSI color output (sets NO_COLOR / FORCE_COLOR=0)."
  - command: "just start    # alias: just tui"
    description: "Launch the interactive Pinboard TUI (= bun run bin/pinboard)."
  - command: "just install"
    description: "Install dependencies (bun install)."
  - command: "just tui-test    # or: cd tui && bun test"
    description: "Run the Ink TUI test suite."
  - command: "just typecheck    # or: cd tui && bun run typecheck"
    description: "Typecheck the TUI package."
